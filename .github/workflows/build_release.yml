name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签'
        required: true
        type: string
      primary_version:
        description: '主发布版本'
        required: true
        type: string
      is_test_mode:
        description: '是否处于测试发布模式'
        required: false
        type: boolean
      publish_only:
        description: '仅发布现有构建产物（跳过所有构建作业）'
        required: false
        default: false
        type: boolean
      source_run_id:
        description: '仅发布模式下复用的源运行 ID'
        required: false
        type: string
      release_name:
        description: '仅发布模式下的发布标题'
        required: false
        type: string
      is_prerelease:
        description: '是否将发布标记为预发布版本'
        required: false
        default: true
        type: boolean
      source_ref:
        description: '手动发布时的源码引用（分支或提交），留空则使用发布标签'
        required: false
        type: string
      is_draft:
        description: '是否创建或保留草稿发布'
        required: false
        default: true
        type: boolean

env:
  PDC_CLIENT_VERSION: 1.0.1.0

jobs:
  build_app:
    runs-on: windows-2022
    if: ${{ github.event.inputs.publish_only != 'true' }}
    env:
      build_id: appBase_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_${{ matrix.package == 'folder' &&  'appBase' || 'app' }}_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ github.event.inputs.is_test_mode }}
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        build_type: ['full', 'selfContained']
        package: ['folder']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows']
    name: Build_AppBase_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.source_ref || github.event.inputs.release_tag }}
      
      - name: List files
        run: ls
      
      - name: Install .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Add GitHub Package Registry
        run: dotnet nuget add source --username ClassFabric --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/ClassIsland/index.json"
        
      - uses: little-core-labs/get-git-tag@v3.0.1
        id: tagName
      
      - name: ☢️ Nuke
        env:
          buildType: ${{ matrix.build_type }}
          package: ${{ matrix.package }}
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
          test_signing_key: ${{ secrets.TEST_SIGNING_KEY }}
          ApiSigningKey: ${{ secrets.API_SIGNING_KEY}}
          ApiSigningKeyPs: ${{ secrets.API_SIGNING_KEY_PS }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          appVersion: ${{ github.event.inputs.release_tag || steps.tagName.outputs.tag }} 
          buildName: ${{ matrix.package == 'folder' &&  'appBase' || 'app' }}  # 打包版本的构建将在这一步直接产生完整的包体，无需经过分装
        run: pwsh -ep bypass ./build.ps1 PublishApp
      
      - name: Upload Unsigned APP to artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ./out/*.zip
            ./out/*.appx

  build_android:
    runs-on: ubuntu-24.04
    if: ${{ false }}
    env:
      artifact_name: out_app_android_${{ matrix.arch }}_monoaot_apk
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        arch: ['arm64', 'x64']
    name: Build_Android_${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.source_ref || github.event.inputs.release_tag }}

      - name: Install .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Add GitHub Package Registry
        run: dotnet nuget add source --username ClassFabric --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/ClassIsland/index.json"

      - uses: little-core-labs/get-git-tag@v3.0.1
        id: tagName

      - name: Decode Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/classfabric.keystore"
          test -s "$RUNNER_TEMP/classfabric.keystore"

      - name: Build and sign Android APK
        env:
          AndroidKeyStore: true
          AndroidSigningKeyStore: ${{ runner.temp }}/classfabric.keystore
          AndroidSigningStorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AndroidSigningKeyPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AndroidSigningKeyAlias: ${{ vars.ANDROID_KEY_ALIAS }}
          appVersion: ${{ github.event.inputs.release_tag || steps.tagName.outputs.tag }}
          arch: ${{ matrix.arch }}
          osName: android
          package: apk
          buildType: monoaot
          buildName: app
          isProductionBuild: ${{ github.event.inputs.release_tag && github.event_name != 'pull_request' && github.event.inputs.is_test_mode != 'true' }}
        run: ./build.sh PublishAndroidApp

      - name: Verify Android APK signature
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: ${{ github.event.inputs.release_tag && github.event_name != 'pull_request' && github.event.inputs.is_test_mode != 'true' && 'cn.classfabric.android' || 'cn.classfabric.android.beta' }}
        run: |
          set -euo pipefail
          APK_PATH="$(find ./out -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          APKSIGNER_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER_PATH"
          "$APKSIGNER_PATH" verify --verbose "$APK_PATH"
          AAPT_PATH="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT_PATH"
          "$AAPT_PATH" dump badging "$APK_PATH" | grep -F "package: name='$EXPECTED_APPLICATION_ID'"

      - name: Remove Android keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/classfabric.keystore"

      - name: Upload Android APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: ./out/*.apk
          if-no-files-found: error
            
  build_launcher:
    runs-on: windows-2022
    if: ${{ github.event.inputs.publish_only != 'true' }}
    env:
      build_id: launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ github.event.inputs.is_test_mode }}
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        build_type: ['aot']
        package: ['singleFile']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows']
    name: Build_Launcher_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.source_ref || github.event.inputs.release_tag }}

      - name: List files
        run: ls
      
      - name: Install .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            10.0.x

      - name: ☢️ Nuke
        env:
          buildType: ${{ matrix.build_type }}
          package: ${{ matrix.package }}
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          buildName: launcher
        run: pwsh -ep bypass ./build.ps1 PublishLauncher
          
      - name: Upload Unsigned APP to artifacts
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ./out/*.zip
            
  sign_1:
    name: Sign_1
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.release_tag && github.event_name != 'pull_request' && github.event.inputs.is_test_mode != 'true' && github.event.inputs.publish_only != 'true' }}
    needs: [ build_app, build_launcher ]
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.source_ref || github.event.inputs.release_tag }}
          
      - name: Get commit hash
        uses: prompt/actions-commit-hash@v3
        id: commit
        with:
          prefix: "${{ github.event.inputs.release_tag }}+"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Create Sign Bundle
        run: |
          pwsh -ep Bypass -c ./tools/release-gen/create-sign-bundle.ps1

      - name: Upload Sign Bundle to artifacts
        id: upload-sign-bundle
        uses: actions/upload-artifact@v4
        with:
          name: sign-bundle
          path: ./ci_tmp/sign_bundle/*
        
      - name: Sign Application
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_TOKEN }}'
          organization-id: '74962648-db7a-4a10-bfdd-0637542e39df'
          project-slug: 'ClassFabric'
          artifact-configuration-slug: 'sign_bundle_v2'
          signing-policy-slug: release-signing
          github-artifact-id: '${{ steps.upload-sign-bundle.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: './out_signed'
          parameters: |
            version: ${{ toJSON(steps.commit.outputs.long) }}
            
      - name: Upload Signed Files to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed_artifacts
          path: ./out_signed/*
            
  pack_app:
    runs-on: windows-2022
    needs: [ sign_1 ]
    if: ${{ always() && success('build_app') && success('build_launcher') && github.event.inputs.publish_only != 'true' }}
    env:
      build_id: app_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      artifact_name: out_app_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
      isTestMode: ${{ github.event.inputs.is_test_mode }}
      arch: ${{ matrix.arch }}
    strategy:
      matrix:
        build_type: ['full', 'selfContained']
        package: ['folder', 'installer']
        arch: ['x64', 'x86', 'arm64']
        os: ['windows']
        exclude:
          - build_type: full
            package: installer
    name: Pack_App_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.source_ref || github.event.inputs.release_tag }}
          
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Combine Artifacts
        run: pwsh -ep bypass ./tools/release-gen/combine-artifacts.ps1

      - name: Generate Package
        env:
          package: ${{ matrix.package }}
          isRelease: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: ${{ matrix.arch }}
          osName: ${{ matrix.os }}
          buildType: ${{ matrix.build_type }}
        run: pwsh -ep bypass ./tools/release-gen/pack/entry.ps1

      - name: Compile .iss to .exe Installer
        if: ${{ matrix.os == 'windows' && matrix.package == 'installer' }}
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./installer/setup.iss
          options: |
            /DAppVersion=${{ github.event.inputs.release_tag || '2.0.0.0' }}
            /FClassFabric_${{ matrix.os }}_${{ matrix.arch }}_${{ matrix.build_type }}_installer
            /O${{ github.workspace }}\out_pack
            /DSourceDir=${{ github.workspace }}\out_pack\pack
            /DArch=${{ matrix.arch }}
      

      - name: Upload Packages and Installer to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ${{ github.workspace }}/out_pack/*.zip
            ${{ github.workspace }}/out_pack/*.exe
          
  build_nupkg:
    runs-on: windows-2022
    if: ${{ false }}
    env:
      Solution_Name: ClassFabric.sln
      Wap_Project_Directory: ClassFabric/ClassFabric
      Wap_Project_Path: ClassFabric/ClassFabric/ClassFabric.csproj
    name: Build Nuget Packages
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.source_ref || github.event.inputs.release_tag }} 

      - name: List files
        run: ls

      - name: Install .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v1.0.2
        
      - name: Build Nuget packages
        env:
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          ls
          ./build.ps1 BuildNupkg --isRelease $env:is_release
      
      - name: Upload Nuget packages to GitHub registry
        if: ${{ github.event_name != 'pull_request' }} 
        env:
          GHPKG_KEY: ${{ secrets.GITHUB_TOKEN }}
          MYGET_ORG_KEY: ${{ secrets.MYGET_ORG_KEY }}
        run: |
          dotnet nuget add source --username github-actions --password $env:GHPKG_KEY --store-password-in-clear-text --name github "https://nuget.pkg.github.com/ClassIsland/index.json"
          dotnet nuget push .\out\package\release\*.nupkg -k $env:GHPKG_KEY --source "github" --skip-duplicate
          dotnet nuget push .\out\package\release\*.nupkg -k $env:MYGET_ORG_KEY --source https://www.myget.org/F/classisland/api/v3/index.json --skip-duplicate

      - name: Upload Nuget Packages to artifacts
        if: ${{ !matrix.trim_assets }}
        uses: actions/upload-artifact@v4
        with:
          name: out_nupkgs
          path: ./out/package/release/*.nupkg

  publish:
    runs-on: ubuntu-latest
    if: ${{ always() && success('pack_app') && github.event.inputs.release_tag && github.event_name != 'pull_request' && github.event.inputs.publish_only != 'true' }}
    needs: [ pack_app ]
    concurrency:
      group: "publish-public"
    environment:
      name: ${{ github.event.inputs.is_test_mode == 'true' && 'staging' || 'public' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event_name != 'workflow_dispatch' && github.ref || github.event.inputs.source_ref || github.event.inputs.release_tag }} 
          
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Prepare Release Artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tools/release-gen/init-artifacts.ps1

          $changelogPath = "doc/ChangeLogs/${{ github.event.inputs.primary_version }}/${{ github.event.inputs.release_tag }}/App.md"
          if (-not (Test-Path $changelogPath)) {
              throw "找不到发布变更日志：$changelogPath"
          }
          Copy-Item -Path $changelogPath -Destination ./out/ChangeLogs.md -Force

      - name: Upload APP to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./out/*.zip,./out/*.appx,./out/*.exe,./out/*.deb,./out/*.pkg,./out/*.apk"
          allowUpdates: true
          removeArtifacts: true
          draft: ${{ github.event.inputs.is_draft != 'false' }}
          prerelease: ${{ github.event.inputs.is_prerelease != 'false' }}
          bodyFile: ./out/ChangeLogs.md
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.release_tag || github.ref }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.release_tag }}
          
  publish_existing:
    name: Publish_Existing_Artifacts
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.publish_only == 'true' && github.event.inputs.release_tag != '' && github.event.inputs.source_run_id != '' }}
    concurrency:
      group: "publish-public"
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_tag }}

      - name: Download Packaged Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: "out_app_windows_*"
          path: ./out_artifacts
          merge-multiple: true

      - name: Prepare Release Assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -Path ./out -ItemType Directory -Force | Out-Null

          $changelogPath = "doc/ChangeLogs/${{ github.event.inputs.primary_version }}/${{ github.event.inputs.release_tag }}/App.md"
          if (-not (Test-Path $changelogPath)) {
              throw "找不到发布变更日志：$changelogPath"
          }
          Copy-Item -Path $changelogPath -Destination ./out/ChangeLogs.md -Force

          $assets = @(Get-ChildItem -Path ./out_artifacts -File)
          if ($assets.Count -eq 0) {
              throw "源运行未返回可发布的 Windows 产物。"
          }

          $assets | ForEach-Object {
              $assetName = $_.Name -replace '^out_app_', 'ClassFabric_app_' -replace '\.exe\.exe$', '.exe'
              Copy-Item -Path $_.FullName -Destination ./out/$assetName -Force
              Write-Host "已准备发布资产：$assetName"
          }

      - name: Upload Assets to Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./out/*.zip,./out/*.exe"
          bodyFile: "./out/ChangeLogs.md"
          allowUpdates: true
          removeArtifacts: true
          draft: true
          prerelease: ${{ github.event.inputs.is_prerelease != 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.release_tag }}
