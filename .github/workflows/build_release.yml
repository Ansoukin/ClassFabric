name: Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（如 2.1.0.1），留空则构建当前分支（仅验证构建，不发布）'
        required: false
        type: string

jobs:
  build_app:
    runs-on: windows-2022
    strategy:
      matrix:
        build_type: ['full', 'selfContained']
    name: Build_AppBase_windows_x64_${{ matrix.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Add GitHub Package Registry
        run: dotnet nuget add source --username ClassFabric --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/ClassIsland/index.json"

      - uses: little-core-labs/get-git-tag@v3.0.1
        id: tagName

      - name: Build portable package
        env:
          buildType: ${{ matrix.build_type }}
          package: folder
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: x64
          osName: windows
          appVersion: ${{ steps.tagName.outputs.tag || github.ref_name }}
          buildName: appBase
        run: pwsh -ep bypass ./build.ps1 PublishApp

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: out_appBase_windows_x64_${{ matrix.build_type }}_folder
          path: ./out/*.zip

  build_launcher:
    runs-on: windows-2022
    name: Build_Launcher_windows_x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build launcher
        env:
          buildType: aot
          package: singleFile
          is_release: ${{ startsWith(github.ref, 'refs/tags/') }}
          arch: x64
          osName: windows
          buildName: launcher
        run: pwsh -ep bypass ./build.ps1 PublishLauncher

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: out_launcher_windows_x64_aot_singleFile
          path: ./out/*.zip

  pack_app:
    runs-on: windows-2022
    needs: [build_app, build_launcher]
    strategy:
      matrix:
        include:
          - build_type: full
            package: folder
          - build_type: selfContained
            package: folder
          - build_type: selfContained
            package: installer
    name: Pack_App_windows_x64_${{ matrix.build_type }}_${{ matrix.package }}
    env:
      artifact_name: out_app_windows_x64_${{ matrix.build_type }}_${{ matrix.package }}
      arch: x64
      osName: windows
      package: ${{ matrix.package }}
      buildType: ${{ matrix.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Combine Artifacts
        run: pwsh -ep bypass ./tools/release-gen/combine-artifacts.ps1

      - name: Generate Package
        run: pwsh -ep bypass ./tools/release-gen/pack/entry.ps1

      - name: Compile installer
        if: ${{ matrix.package == 'installer' }}
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./installer/setup.iss
          options: |
            /DAppVersion=${{ github.event.inputs.release_tag || github.ref_name }}
            /FClassFabric_windows_x64_${{ matrix.build_type }}_installer.exe
            /O${{ github.workspace }}\out_pack
            /DSourceDir=${{ github.workspace }}\out_pack\pack
            /DArch=${{ matrix.arch }}

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: |
            ${{ github.workspace }}/out_pack/*.zip
            ${{ github.workspace }}/out_pack/*.exe

  publish:
    runs-on: ubuntu-latest
    needs: [pack_app]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    concurrency:
      group: "release-publish"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./out_artifacts

      - name: Collect Release Files
        run: pwsh -ep bypass ./tools/release-gen/init-artifacts.ps1

      - name: Collect Changelog Body
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          primary="$(echo "$ver" | cut -d. -f1-2)"
          f="doc/ChangeLogs/${primary}/${ver}/App.md"
          mkdir -p out
          if [ -f "$f" ]; then
            cp "$f" out/ChangeLogs.md
          else
            printf 'ClassFabric %s\n' "$ver" > out/ChangeLogs.md
          fi

      - name: Create Draft Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./out/*.zip,./out/*.exe"
          draft: true
          generateReleaseNotes: true
          bodyFile: ./out/ChangeLogs.md
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          allowUpdates: true
