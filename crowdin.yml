# Crowdin 本地化同步配置（GitHub App 与 CLI 共用）
# ⚠ 当前处于冻结状态（2.1.1.4 起）：云侧项目与翻译全部保留，同步暂停，本文件暂不追加新资源组。
# 冻结原因：源文件路径与工程名已整体回归 ClassIsland.*（本文件内的 source 路径已同步更新），
# 重新开闸前需先在 Crowdin 云侧核对源路径映射与已翻译串，迁移方案另行立项，勿直接恢复同步。
# 凭据不入库：GitHub App 在集成界面授权；CLI 走环境变量 CROWDIN_PROJECT_ID / CROWDIN_PERSONAL_TOKEN
# 维护规则：新增本地化资源组时，在 files 中追加对应条目（源文件=无语言后缀的默认 resx，即简中文案）
# 首次同步校验点：源字符串总数应为 734（Main 86 + SettingsPage 41 + General 57 + TrayMenu 8 + 设置页 12 组 542）
project_id_env: CROWDIN_PROJECT_ID
project_id: 935471
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
base_url: 'https://api.crowdin.com'
preserve_hierarchy: true

pull_request_title: 'chore(i18n): Crowdin 翻译更新'
pull_request_labels:
  - crowdin
  - i18n

files:
  # ── 主界面、设置窗口、托盘菜单（语言设置基础设施同期资源组）──
